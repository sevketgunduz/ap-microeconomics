<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img"><rect width="560" height="300" rx="6" fill="#fdfcfa"/><text x="56" y="24" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#23211d">Opportunity cost of one year of college</text><rect x="130.0" y="88.0" width="150.0" height="54.0" rx="2" fill="#9a5b32" stroke="none"/><text x="205.0" y="121.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#fff" text-anchor="middle" font-weight="700" >$12,000</text><text x="205.0" y="76.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6d6a63" text-anchor="middle" font-weight="400" >explicit — tuition and fees</text><rect x="130.0" y="144.0" width="150.0" height="78.0" rx="2" fill="#2f6b7a" stroke="none"/><text x="205.0" y="189.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#fff" text-anchor="middle" font-weight="700" >$28,000</text><text x="205.0" y="240.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6d6a63" text-anchor="middle" font-weight="400" >implicit — the wage forgone</text><line x1="293" y1="88" x2="303" y2="88" stroke="#23211d" stroke-width="1.4"/><line x1="293" y1="222" x2="303" y2="222" stroke="#23211d" stroke-width="1.4"/><line x1="298" y1="88" x2="298" y2="222" stroke="#23211d" stroke-width="1.4"/><text x="312.0" y="148.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#23211d" text-anchor="start" font-weight="700" >total economic</text><text x="312.0" y="166.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#23211d" text-anchor="start" font-weight="700" >cost = $40,000</text><text x="88.0" y="288.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6d6a63" text-anchor="start" font-weight="400" >College is never free, which is why the choice differs by forgone wage.</text><text x="88.0" y="273.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6d6a63" text-anchor="start" font-weight="400" >A full scholarship removes the $12,000 and leaves the $28,000 untouched.</text></svg>