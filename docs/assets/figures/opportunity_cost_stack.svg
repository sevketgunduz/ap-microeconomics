<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img"><rect width="560" height="300" rx="6" fill="#fdfcfa"/><text x="56" y="24" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#23211d">Opportunity cost: the ticket price is only half of it</text><rect x="130.0" y="92.0" width="150.0" height="58.0" rx="2" fill="#9a5b32" stroke="none"/><text x="205.0" y="127.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="700" >$60 explicit</text><text x="205.0" y="78.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6d6a63" text-anchor="middle" font-weight="400" >ticket price</text><rect x="130.0" y="152.0" width="150.0" height="58.0" rx="2" fill="#2f6b7a" stroke="none"/><text x="205.0" y="187.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="700" >$60 implicit</text><text x="205.0" y="232.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6d6a63" text-anchor="middle" font-weight="400" >4 hours × $15 wage forgone</text><line x1="298" y1="92" x2="298" y2="210" stroke="#23211d" stroke-width="1.4"/><line x1="293" y1="92" x2="303" y2="92" stroke="#23211d" stroke-width="1.4"/><line x1="293" y1="210" x2="303" y2="210" stroke="#23211d" stroke-width="1.4"/><text x="312.0" y="145.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#23211d" text-anchor="start" font-weight="700" >total economic</text><text x="312.0" y="163.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#23211d" text-anchor="start" font-weight="700" >cost = $120</text><text x="88.0" y="288.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6d6a63" text-anchor="start" font-weight="400" >A student who counts only the money paid understates the cost by half.</text></svg>