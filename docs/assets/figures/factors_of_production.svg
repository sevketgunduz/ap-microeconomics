<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img"><rect width="560" height="300" rx="6" fill="#fdfcfa"/><text x="18" y="24" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#23211d">Resources: the four factors of production</text><rect x="40.0" y="74.0" width="116.0" height="84.0" rx="5" fill="#f2ece6" stroke="none"/><text x="98.0" y="98.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9a5b32" text-anchor="middle" font-weight="700" >Land</text><text x="98.0" y="118.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" fill="#6d6a63" text-anchor="middle" font-weight="400" >everything from nature —</text><text x="98.0" y="132.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" fill="#6d6a63" text-anchor="middle" font-weight="400" >minerals, timber, water</text><rect x="168.0" y="74.0" width="116.0" height="84.0" rx="5" fill="#f2ece6" stroke="none"/><text x="226.0" y="98.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9a5b32" text-anchor="middle" font-weight="700" >Labor</text><text x="226.0" y="118.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" fill="#6d6a63" text-anchor="middle" font-weight="400" >the effort of workers</text><rect x="296.0" y="74.0" width="116.0" height="84.0" rx="5" fill="#f2ece6" stroke="none"/><text x="354.0" y="98.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9a5b32" text-anchor="middle" font-weight="700" >Capital</text><text x="354.0" y="118.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" fill="#6d6a63" text-anchor="middle" font-weight="400" >manufactured goods used</text><text x="354.0" y="132.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" fill="#6d6a63" text-anchor="middle" font-weight="400" >to make other goods</text><rect x="424.0" y="74.0" width="116.0" height="84.0" rx="5" fill="#f2ece6" stroke="none"/><text x="482.0" y="98.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9a5b32" text-anchor="middle" font-weight="700" >Entrepreneurship</text><text x="482.0" y="118.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" fill="#6d6a63" text-anchor="middle" font-weight="400" >risk-taking, innovation,</text><text x="482.0" y="132.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" fill="#6d6a63" text-anchor="middle" font-weight="400" >organising production</text><line x1="290.0" y1="166" x2="290.0" y2="200" stroke="#23211d" stroke-width="1.8" marker-end="url(#a)"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#23211d"/></marker></defs><rect x="172.0" y="204.0" width="236.0" height="40.0" rx="5" fill="#9a5b32" stroke="none"/><text x="290.0" y="229.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#fff" text-anchor="middle" font-weight="700" >Goods and services</text><text x="32.0" y="288.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6d6a63" text-anchor="start" font-weight="400" >That second half is CED MKT-1.A.2 and Krugman never states it.</text><text x="32.0" y="273.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6d6a63" text-anchor="start" font-weight="400" >Most factors are scarce. Some — established knowledge — are non-rival, so not scarce.</text></svg>