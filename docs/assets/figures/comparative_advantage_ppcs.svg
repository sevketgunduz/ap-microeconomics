" x2="385.1" y2="334.0" stroke="#2f6b7a" stroke-width="2.4" stroke-linecap="round"/><text x="312.8" y="188.7" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#9a5b32" text-anchor="start" font-weight="700" >Aland   slope 2</text><text x="274.5" y="285.2" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#2f6b7a" text-anchor="start" font-weight="700" >Belara   slope 1</text><text x="70.3" y="69.4" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#23211d" text-anchor="start" font-weight="600" >1 cloth costs Aland 2 wheat, Belara only 1</text><text x="70.3" y="84.9" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#2f6b7a" text-anchor="start" font-weight="600" >→ Belara has the comparative advantage in cloth</text><text x="58.0" y="404.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6d6a63" text-anchor="start" font-weight="400" >Aland's steeper curve means cloth is expensive there in wheat forgone.</text><text x="58.0" y="389.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6d6a63" text-anchor="start" font-weight="400" >Both curves assume 100 workers.</text></svg>